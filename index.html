<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Loto Quine</title>
<style>
  :root {
    --bg: #0b1120;
    --panel-bg: #121a2e;
    --panel-border: #223154;
    --text: #f1f5f9;
    --text-dim: #94a3b8;
    --undrawn-bg: #1e293b;
    --undrawn-text: #475569;
    --drawn: #16a34a;
    --drawn-text: #ecfdf5;
    --last: #f59e0b;
    --last-text: #1c1305;
    --accent: #3b82f6;
    --accent-hover: #60a5fa;
    --danger: #ef4444;
    --danger-hover: #f87171;
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ---------- Toolbar ---------- */

  .toolbar {
    display: flex;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
    background: var(--panel-bg);
    border-bottom: 1px solid var(--panel-border);
    padding: 6px 16px;
    flex-shrink: 0;
  }

  .toolbar-left {
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .logo {
    font-size: 20px;
    font-weight: 700;
    white-space: nowrap;
  }

  .counter {
    color: var(--text-dim);
    font-size: 14px;
    white-space: nowrap;
  }

  .draw-form {
    display: flex;
    align-items: center;
    gap: 10px;
    position: relative;
  }

  .draw-form input {
    width: 90px;
    font-size: 20px;
    padding: 8px 10px;
    border-radius: 8px;
    border: 1px solid var(--panel-border);
    background: var(--undrawn-bg);
    color: var(--text);
    text-align: center;
  }

  .draw-form input::-webkit-outer-spin-button,
  .draw-form input::-webkit-inner-spin-button {
    -webkit-appearance: none;
    margin: 0;
  }
  .draw-form input[type=number] { -moz-appearance: textfield; }

  .draw-form input:focus {
    outline: 2px solid var(--accent);
  }

  .error-msg {
    position: absolute;
    left: 0;
    top: 100%;
    margin-top: 4px;
    color: var(--danger);
    font-size: 13px;
    white-space: nowrap;
  }

  .shake { animation: shake 0.3s; }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-6px); }
    75% { transform: translateX(6px); }
  }

  .toolbar-right {
    display: flex;
    gap: 10px;
    margin-left: auto;
    flex-wrap: wrap;
  }

  button {
    font-family: inherit;
    font-size: 14px;
    cursor: pointer;
    border: none;
    border-radius: 8px;
    padding: 9px 14px;
    transition: background-color 0.15s, opacity 0.15s;
  }

  .btn-primary { background: var(--accent); color: white; }
  .btn-primary:hover { background: var(--accent-hover); }

  .btn-secondary {
    background: var(--undrawn-bg);
    color: var(--text);
    border: 1px solid var(--panel-border);
  }
  .btn-secondary:hover { background: #29354f; }

  .btn-danger { background: var(--danger); color: white; }
  .btn-danger:hover { background: var(--danger-hover); }

  button:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }
  button:disabled:hover { background: var(--undrawn-bg); }

  /* ---------- Main layout ---------- */

  main {
    flex: 1;
    display: grid;
    grid-template-columns: minmax(190px, 17%) 1fr;
    gap: 10px;
    padding: 10px;
    min-height: 0;
  }

  @media (max-width: 900px) {
    main { grid-template-columns: 1fr; }
  }

  .last-panel {
    background: var(--panel-bg);
    border: 1px solid var(--panel-border);
    border-radius: 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 12px;
    gap: 10px;
    min-height: 0;
  }

  .last-label {
    color: var(--text-dim);
    font-size: 14px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }

  .last-number {
    font-size: clamp(50px, 9vw, 150px);
    font-weight: 800;
    width: clamp(110px, 13vw, 210px);
    height: clamp(110px, 13vw, 210px);
    border-radius: 50%;
    background: var(--undrawn-bg);
    color: var(--text-dim);
    display: flex;
    align-items: center;
    justify-content: center;
    border: 6px solid var(--panel-border);
    line-height: 1;
  }

  .last-number.set {
    background: var(--last);
    color: var(--last-text);
    border-color: #fbbf24;
  }

  .last-number.pulse { animation: pulse 0.5s ease-out; }
  @keyframes pulse {
    0% { transform: scale(1.15); }
    100% { transform: scale(1); }
  }

  .recent-strip {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px;
    max-height: 30%;
    overflow-y: auto;
  }

  .recent-strip .badge {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: var(--drawn);
    color: var(--drawn-text);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 15px;
    font-weight: 700;
    flex-shrink: 0;
  }

  /* ---------- Grid panel ---------- */

  .grid-panel {
    background: var(--panel-bg);
    border: 1px solid var(--panel-border);
    border-radius: 16px;
    padding: 8px;
    min-height: 0;
    overflow: auto;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(10, minmax(0, 1fr));
    grid-template-rows: repeat(9, minmax(0, 1fr));
    gap: clamp(3px, 0.4vw, 8px);
    height: 100%;
    width: 100%;
  }

  .cell {
    background: var(--undrawn-bg);
    color: var(--undrawn-text);
    border: none;
    border-radius: 8px;
    font-weight: 700;
    font-size: clamp(20px, min(3.6vw, 7vh), 80px);
    display: flex;
    align-items: center;
    justify-content: center;
    min-width: 0;
    min-height: 0;
    overflow: hidden;
    cursor: pointer;
    transition: transform 0.1s, background-color 0.15s;
  }

  .cell:hover:not(.drawn) {
    background: #29354f;
    color: var(--text);
  }

  .cell.drawn {
    background: var(--drawn);
    color: var(--drawn-text);
    cursor: default;
  }

  .cell.last {
    background: var(--last);
    color: var(--last-text);
    box-shadow: 0 0 0 3px #fbbf24;
    transform: scale(1.05);
  }

  /* ---------- History modal ---------- */

  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    align-items: center;
    justify-content: center;
    z-index: 10;
  }
  .modal-overlay.open { display: flex; }

  .modal {
    background: var(--panel-bg);
    border: 1px solid var(--panel-border);
    border-radius: 16px;
    width: min(640px, 90vw);
    max-height: 80vh;
    display: flex;
    flex-direction: column;
  }

  .modal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 20px;
    border-bottom: 1px solid var(--panel-border);
  }

  .modal-header h2 { margin: 0; font-size: 18px; }

  .modal-body {
    padding: 16px 20px;
    overflow-y: auto;
  }

  .modal-footer {
    padding: 14px 20px;
    border-top: 1px solid var(--panel-border);
    display: flex;
    justify-content: flex-end;
  }

  .round-entry {
    border: 1px solid var(--panel-border);
    border-radius: 10px;
    padding: 12px 14px;
    margin-bottom: 10px;
  }

  .round-entry .round-title {
    font-weight: 700;
    margin-bottom: 6px;
  }

  .round-entry .round-numbers {
    color: var(--text-dim);
    font-size: 14px;
    line-height: 1.6;
    word-break: break-word;
  }

  .empty-hint {
    color: var(--text-dim);
    text-align: center;
    padding: 20px 0;
  }
</style>
</head>
<body>

<header class="toolbar">
  <div class="toolbar-left">
    <span class="logo">🎱 Loto Quine</span>
    <span class="counter" id="counter">0 / 90 numéros sortis</span>
  </div>

  <form class="draw-form" id="drawForm" autocomplete="off">
    <input type="number" id="numberInput" min="1" max="90" placeholder="N°" inputmode="numeric" autofocus>
    <button type="submit" class="btn-primary">Valider</button>
    <span class="error-msg" id="errorMsg"></span>
  </form>

  <div class="toolbar-right">
    <button type="button" id="undoBtn" class="btn-secondary" disabled>↩ Annuler dernier</button>
    <button type="button" id="newRoundBtn" class="btn-secondary">🔄 Nouvelle manche</button>
    <button type="button" id="historyBtn" class="btn-secondary">📋 Historique</button>
    <button type="button" id="fullscreenBtn" class="btn-secondary">🖥️ Plein écran</button>
  </div>
</header>

<main>
  <section class="last-panel">
    <div class="last-label">Dernier numéro sorti</div>
    <div class="last-number" id="lastNumber">—</div>
    <div class="recent-strip" id="recentStrip"></div>
  </section>

  <section class="grid-panel">
    <div class="grid" id="grid"></div>
  </section>
</main>

<div class="modal-overlay" id="historyOverlay">
  <div class="modal">
    <div class="modal-header">
      <h2>Historique des manches</h2>
      <button type="button" id="closeHistoryBtn" class="btn-secondary">✕</button>
    </div>
    <div class="modal-body" id="historyList"></div>
    <div class="modal-footer">
      <button type="button" id="clearHistoryBtn" class="btn-danger">Vider l'historique</button>
    </div>
  </div>
</div>

<script type="module">
  const STORAGE_KEY = "loto-quine-state-v1";

  const defaultState = () => ({ current: { drawnNumbers: [] }, history: [] });

  function loadState() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return defaultState();
      const parsed = JSON.parse(raw);
      if (!parsed?.current?.drawnNumbers || !Array.isArray(parsed.history)) return defaultState();
      return parsed;
    } catch {
      return defaultState();
    }
  }

  function saveState() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  }

  const state = loadState();

  const gridEl = document.getElementById("grid");
  const counterEl = document.getElementById("counter");
  const lastNumberEl = document.getElementById("lastNumber");
  const recentStripEl = document.getElementById("recentStrip");
  const drawForm = document.getElementById("drawForm");
  const numberInput = document.getElementById("numberInput");
  const errorMsgEl = document.getElementById("errorMsg");
  const undoBtn = document.getElementById("undoBtn");
  const newRoundBtn = document.getElementById("newRoundBtn");
  const historyBtn = document.getElementById("historyBtn");
  const closeHistoryBtn = document.getElementById("closeHistoryBtn");
  const clearHistoryBtn = document.getElementById("clearHistoryBtn");
  const historyOverlay = document.getElementById("historyOverlay");
  const historyListEl = document.getElementById("historyList");
  const fullscreenBtn = document.getElementById("fullscreenBtn");

  const cells = new Map();
  for (let n = 1; n <= 90; n++) {
    const cell = document.createElement("button");
    cell.type = "button";
    cell.className = "cell";
    cell.textContent = n;
    cell.setAttribute("aria-label", `Numéro ${n}`);
    cell.addEventListener("click", () => tryDraw(n));
    gridEl.appendChild(cell);
    cells.set(n, cell);
  }

  let errorTimer = null;
  function showError(message) {
    errorMsgEl.textContent = message;
    drawForm.classList.remove("shake");
    void drawForm.offsetWidth;
    drawForm.classList.add("shake");
    clearTimeout(errorTimer);
    errorTimer = setTimeout(() => { errorMsgEl.textContent = ""; }, 2500);
  }

  function tryDraw(n) {
    if (!Number.isInteger(n) || n < 1 || n > 90) {
      showError("Le numéro doit être entre 1 et 90.");
      return;
    }
    if (state.current.drawnNumbers.includes(n)) {
      showError(`Le numéro ${n} est déjà sorti.`);
      return;
    }
    state.current.drawnNumbers.push(n);
    saveState();
    render({ justDrawn: true });
  }

  function undo() {
    if (state.current.drawnNumbers.length === 0) return;
    state.current.drawnNumbers.pop();
    saveState();
    render();
  }

  function newRound() {
    if (state.current.drawnNumbers.length === 0) return;
    if (!confirm("Terminer cette manche et repartir sur une grille vierge ?")) return;
    state.history.unshift({
      id: Date.now(),
      ts: Date.now(),
      drawnNumbers: [...state.current.drawnNumbers],
    });
    state.current.drawnNumbers = [];
    saveState();
    render();
  }

  function clearHistory() {
    if (state.history.length === 0) return;
    if (!confirm("Supprimer définitivement l'historique des manches précédentes ?")) return;
    state.history = [];
    saveState();
    renderHistory();
  }

  function render({ justDrawn = false } = {}) {
    const drawn = state.current.drawnNumbers;
    const drawnSet = new Set(drawn);
    const last = drawn[drawn.length - 1];

    counterEl.textContent = `${drawn.length} / 90 numéros sortis`;

    for (const [n, cell] of cells) {
      cell.classList.toggle("drawn", drawnSet.has(n));
      cell.classList.toggle("last", n === last);
    }

    if (last === undefined) {
      lastNumberEl.textContent = "—";
      lastNumberEl.classList.remove("set");
    } else {
      lastNumberEl.textContent = last;
      lastNumberEl.classList.add("set");
      if (justDrawn) {
        lastNumberEl.classList.remove("pulse");
        void lastNumberEl.offsetWidth;
        lastNumberEl.classList.add("pulse");
      }
    }

    recentStripEl.innerHTML = "";
    [...drawn].reverse().slice(0, 12).forEach((n) => {
      const badge = document.createElement("span");
      badge.className = "badge";
      badge.textContent = n;
      recentStripEl.appendChild(badge);
    });

    undoBtn.disabled = drawn.length === 0;
  }

  function formatDate(ts) {
    return new Date(ts).toLocaleString("fr-FR", {
      day: "2-digit", month: "2-digit", year: "numeric",
      hour: "2-digit", minute: "2-digit",
    });
  }

  function renderHistory() {
    historyListEl.innerHTML = "";
    if (state.history.length === 0) {
      const hint = document.createElement("div");
      hint.className = "empty-hint";
      hint.textContent = "Aucune manche terminée pour l'instant.";
      historyListEl.appendChild(hint);
    } else {
      state.history.forEach((round, i) => {
        const entry = document.createElement("div");
        entry.className = "round-entry";

        const title = document.createElement("div");
        title.className = "round-title";
        title.textContent = `Manche ${state.history.length - i} — ${formatDate(round.ts)} (${round.drawnNumbers.length} numéros)`;

        const numbers = document.createElement("div");
        numbers.className = "round-numbers";
        numbers.textContent = round.drawnNumbers.join(" · ");

        entry.appendChild(title);
        entry.appendChild(numbers);
        historyListEl.appendChild(entry);
      });
    }
    clearHistoryBtn.disabled = state.history.length === 0;
  }

  drawForm.addEventListener("submit", (e) => {
    e.preventDefault();
    const value = numberInput.value.trim();
    if (value === "") return;
    tryDraw(parseInt(value, 10));
    numberInput.value = "";
    numberInput.focus();
  });

  undoBtn.addEventListener("click", undo);
  newRoundBtn.addEventListener("click", newRound);

  historyBtn.addEventListener("click", () => {
    renderHistory();
    historyOverlay.classList.add("open");
  });

  function closeHistory() {
    historyOverlay.classList.remove("open");
    numberInput.focus();
  }

  closeHistoryBtn.addEventListener("click", closeHistory);
  historyOverlay.addEventListener("click", (e) => {
    if (e.target === historyOverlay) closeHistory();
  });
  clearHistoryBtn.addEventListener("click", clearHistory);

  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && historyOverlay.classList.contains("open")) closeHistory();
  });

  fullscreenBtn.addEventListener("click", () => {
    if (document.fullscreenElement) {
      document.exitFullscreen();
    } else {
      document.documentElement.requestFullscreen();
    }
  });

  render();
</script>

</body>
</html>
